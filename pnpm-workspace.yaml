# pnpm 12 gates dependency build scripts behind this map, and errors with
# ERR_PNPM_IGNORED_BUILDS on a non-interactive install when an entry is missing.
# `pnpm approve-builds` writes this exact shape.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
