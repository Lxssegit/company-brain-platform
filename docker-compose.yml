services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: company_brain
    ports:
      - "5432:5432"
    volumes:
      - company_brain_postgres:/var/lib/postgresql/data

volumes:
  company_brain_postgres:
