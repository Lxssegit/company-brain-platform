name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          AUTH_SECRET: ci-only-secret-not-used-at-runtime
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/company_brain

  database:
    name: Migration and seed against pgvector
    runs-on: ubuntu-latest
    # The initial migration creates the pgvector extension and an HNSW index on
    # KnowledgeUnit.embedding. Neither can be exercised without a database that
    # actually has the extension, which is what this job is for.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: company_brain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/company_brain
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm db:seed
      # Running it twice proves the seed is idempotent rather than
      # only working on an empty database.
      - run: pnpm db:seed
      # `prisma migrate diff` cannot be used here: the pgvector and full-text
      # indexes are raw SQL that the Prisma datamodel has no way to express, so
      # a diff against the datamodel reports them as drift forever. Asserting
      # they exist is both the honest check and the more useful one — these are
      # the two statements that cannot be exercised without pgvector.
      - name: The raw indexes the schema cannot express really exist
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE found int; coltype text;
          BEGIN
            SELECT count(*) INTO found FROM pg_indexes
             WHERE tablename = 'KnowledgeUnit'
               AND indexname IN ('KnowledgeUnit_embedding_hnsw_idx', 'KnowledgeUnit_fulltext_de_idx');
            IF found <> 2 THEN
              RAISE EXCEPTION 'expected both raw indexes on KnowledgeUnit, found %', found;
            END IF;

            SELECT format_type(atttypid, atttypmod) INTO coltype FROM pg_attribute
             WHERE attrelid = '"KnowledgeUnit"'::regclass AND attname = 'embedding';
            IF coltype <> 'vector(1536)' THEN
              RAISE EXCEPTION 'embedding must stay vector(1536) for the HNSW index, got %', coltype;
            END IF;

            RAISE NOTICE 'hnsw and full-text indexes present, embedding is vector(1536)';
          END $$;
          SQL

      # Every retrieval test outside this job runs on a database without
      # pgvector, so the vector half has never executed there — which is how a
      # dimension bug reached CI once already. These run the real
      # retrieveAuthorizedContext against the real index, with a deterministic
      # stand-in for the embedding provider so no API key is needed.
      - name: Vector retrieval and its permission boundary
        run: pnpm test:integration
